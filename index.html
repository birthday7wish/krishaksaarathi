<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Pump Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    h2 { margin-bottom: 5px; font-weight: 600; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px; }

    .status-badge {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      background-color: rgba(148, 163, 184, 0.2);
      color: var(--text-muted);
      margin-bottom: 25px;
      transition: all 0.3s ease;
    }
    .status-badge.connected { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    #connectBtn { background-color: var(--primary); color: white; }
    #connectBtn:hover { background-color: var(--primary-hover); transform: translateY(-2px); }

    #voiceBtn { background-color: #334155; color: white; }
    #voiceBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #voiceBtn:not(:disabled):hover { background-color: #475569; transform: translateY(-2px); }
    
    /* Animation for when microphone is listening */
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .listening { background-color: var(--danger) !important; animation: pulse 1.5s infinite; }

    .terminal {
      background-color: #000;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      font-family: monospace;
      color: var(--success);
      font-size: 0.85rem;
      text-align: left;
      min-height: 60px;
      border: 1px solid #333;
    }

    .commands-box {
      margin-top: 30px;
      background-color: rgba(255,255,255,0.03);
      padding: 15px;
      border-radius: 12px;
      text-align: left;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .commands-box h4 { margin-bottom: 10px; color: var(--primary); font-size: 0.95rem;}
    .commands-box ul { list-style: none; font-size: 0.85rem; color: var(--text-muted); }
    .commands-box li { margin-bottom: 5px; padding-left: 15px; position: relative; }
    .commands-box li::before { content: "•"; position: absolute; left: 0; color: var(--primary); }
    .highlight { color: var(--text-main); font-weight: 600; }
  </style>
</head>
<body>

  <div class="container">
    <h2>💧 Smart Pump</h2>
    <p class="subtitle">BLE Voice Control Interface</p>

    <div id="statusBadge" class="status-badge">Bluetooth Disconnected</div>

    <button id="connectBtn">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
      Connect to ESP32
    </button>

    <button id="voiceBtn" disabled>
      🎤 Start Voice Command
    </button>

    <div class="terminal" id="terminalLog">
      > Awaiting connection...
    </div>

    <div class="commands-box">
      <h4>Supported Commands</h4>
      <ul>
        <li><span class="highlight">"Turn on"</span> or <span class="highlight">"Start"</span> (Activates Pump)</li>
        <li><span class="highlight">"Turn off"</span> or <span class="highlight">"Stop"</span> (Deactivates Pump)</li>
        <li><span class="highlight">"Pump on / Pump off"</span></li>
      </ul>
    </div>
  </div>

  <script>
    const serviceUuid = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const characteristicUuid = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    let pumpCharacteristic;

    const connectBtn = document.getElementById('connectBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const statusBadge = document.getElementById('statusBadge');
    const terminalLog = document.getElementById('terminalLog');

    function logToTerminal(message) {
      terminalLog.innerHTML = `> ${message}`;
    }

    // Bluetooth Setup
    connectBtn.addEventListener('click', async () => {
      try {
        logToTerminal('Scanning for ESP32_Pump...');
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32_Pump' }],
          optionalServices: [serviceUuid]
        });
        
        device.addEventListener('gattserverdisconnected', () => {
          statusBadge.className = 'status-badge';
          statusBadge.innerText = 'Bluetooth Disconnected';
          voiceBtn.disabled = true;
          logToTerminal('Device disconnected.');
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(serviceUuid);
        pumpCharacteristic = await service.getCharacteristic(characteristicUuid);
        
        statusBadge.className = 'status-badge connected';
        statusBadge.innerText = 'Bluetooth Connected';
        voiceBtn.disabled = false;
        connectBtn.style.display = 'none'; // Hide connect button once connected
        logToTerminal('Connected successfully. Ready.');
      } catch (error) {
        logToTerminal(`Error: ${error.message || error}`);
      }
    });

    // Speech Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      
      voiceBtn.addEventListener('click', () => {
        recognition.start();
      });

      recognition.onstart = () => {
        voiceBtn.classList.add('listening');
        voiceBtn.innerHTML = '🛑 Listening...';
        logToTerminal('Listening for voice commands...');
      };

      recognition.onend = () => {
        voiceBtn.classList.remove('listening');
        voiceBtn.innerHTML = '🎤 Start Voice Command';
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase().trim();
        logToTerminal(`Heard: "${transcript}"`);
        
        if (!pumpCharacteristic) return;

        let command = "";
        
        // Upgraded command parsing
        if (transcript.includes('on') || transcript.includes('start')) {
          command = "on";
        } else if (transcript.includes('off') || transcript.includes('stop')) {
          command = "off";
        }

        if (command) {
          try {
            const encoder = new TextEncoder();
            await pumpCharacteristic.writeValue(encoder.encode(command));
            logToTerminal(`Success! Pump turned <strong>${command.toUpperCase()}</strong>`);
          } catch (error) {
             logToTerminal(`Failed to send data: ${error}`);
          }
        } else {
          setTimeout(() => {
            logToTerminal(`Unrecognized command. Try "start" or "stop".`);
          }, 1500);
        }
      };
    } else {
      logToTerminal('Error: Web Speech API is not supported in this browser.');
    }
  </script>
</body>
</html>
